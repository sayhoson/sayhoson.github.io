  <title id="title">Research collaboration map</title><desc id="desc">Modeling, experiments, and engineering applications connect through a shared research program.</desc><rect width="1200" height="500" fill="#050b14"/><g stroke="#4ee0ed" stroke-opacity=".15"><path d="M0 80H1200M0 420H1200M150 0V500M600 0V500M1050 0V500"/></g><g font-family="Arial, sans-serif" text-anchor="middle"><text x="600" y="70" fill="#7d95a5" font-size="19" letter-spacing="5">COLLABORATIVE RESEARCH LOOP</text><g fill="#0d2034" stroke="#4ee0ed" stroke-width="2"><circle cx="260" cy="255" r="104"/><circle cx="600" cy="255" r="104"/><circle cx="940" cy="255" r="104"/></g><path d="M365 255h125M710 255h125" stroke="#4ee0ed" stroke-width="7"/><path d="m470 240 24 15-24 15m340-30 24 15-24 15" fill="none" stroke="#a8f4f5" stroke-width="5"/><text x="260" y="245" fill="#eef7fb" font-size="26" font-weight="700">MODELING</text><text x="260" y="282" fill="#b9cad5" font-size="18">physics + simulation</text><text x="600" y="245" fill="#eef7fb" font-size="26" font-weight="700">EXPERIMENT</text><text x="600" y="282" fill="#b9cad5" font-size="18">measure + validate</text><text x="940" y="245" fill="#eef7fb" font-size="26" font-weight="700">APPLICATION</text><text x="940" y="282" fill="#b9cad5" font-size="18">deploy + iterate</text></g>
