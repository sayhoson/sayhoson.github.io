<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Physics-informed operator learning workflow</title><desc id="desc">Operating conditions and physical constraints enter a deep operator network that predicts a machine response field.</desc>
  <defs><linearGradient id="surface" x1="0" x2="1"><stop stop-color="#091728"/><stop offset="1" stop-color="#0d2034"/></linearGradient><linearGradient id="signal" x1="0" x2="1"><stop stop-color="#4ee0ed"/><stop offset="1" stop-color="#a8f4f5"/></linearGradient></defs>
  <rect width="1200" height="750" fill="#050b14"/><path d="M0 90H1200M0 660H1200" stroke="#4ee0ed" stroke-opacity=".16"/>
  <g fill="none" stroke="#4ee0ed" stroke-opacity=".16"><path d="M86 0V750M320 0V750M600 0V750M890 0V750M1110 0V750"/></g>
  <text x="70" y="90" fill="#7d95a5" font-family="Arial, sans-serif" font-size="22" letter-spacing="5">PHYSICS-INFORMED OPERATOR LEARNING</text>
  <g font-family="Arial, sans-serif"><rect x="70" y="225" width="230" height="280" rx="8" fill="url(#surface)" stroke="#4ee0ed" stroke-opacity=".42"/><text x="100" y="280" fill="#eef7fb" font-size="25" font-weight="700">CONDITIONS</text><text x="100" y="330" fill="#b9cad5" font-size="20">speed ω</text><text x="100" y="370" fill="#b9cad5" font-size="20">load τ</text><text x="100" y="410" fill="#b9cad5" font-size="20">material ξ</text><path d="M100 455h170" stroke="#4ee0ed" stroke-width="3"/><text x="100" y="480" fill="#7d95a5" font-size="16">branch input</text>
