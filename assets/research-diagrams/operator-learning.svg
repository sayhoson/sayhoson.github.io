  <rect x="885" y="225" width="245" height="280" rx="8" fill="url(#surface)" stroke="#4ee0ed" stroke-opacity=".42"/><text x="915" y="280" fill="#eef7fb" font-size="25" font-weight="700">RESPONSE</text><path d="M915 420c30-100 65 55 105-55s55 35 85-65" fill="none" stroke="url(#signal)" stroke-width="6"/><text x="915" y="465" fill="#b9cad5" font-size="20">field u(x, t)</text><text x="915" y="495" fill="#7d95a5" font-size="16">surrogate prediction</text>
  <path d="M305 365h90M770 365h105" stroke="url(#signal)" stroke-width="6"/><path d="m385 350 25 15-25 15m470-15 25 15-25 15" fill="none" stroke="#a8f4f5" stroke-width="5"/></g>
