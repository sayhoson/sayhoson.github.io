<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Multiphysics digital twin of a permanent magnet synchronous motor</title><desc id="desc">A physical motor and measurements are coupled to an electromagnetic and structural digital twin.</desc>
  <defs><linearGradient id="blue" x1="0" x2="1"><stop stop-color="#4ee0ed"/><stop offset="1" stop-color="#a8f4f5"/></linearGradient></defs><rect width="1200" height="750" fill="#050b14"/><g stroke="#4ee0ed" stroke-opacity=".13"><path d="M0 100H1200M0 650H1200M100 0V750M420 0V750M780 0V750M1100 0V750"/></g>
  <text x="70" y="90" fill="#7d95a5" font-family="Arial, sans-serif" font-size="22" letter-spacing="5">MULTIPHYSICS DIGITAL TWIN</text>
  <g font-family="Arial, sans-serif"><text x="155" y="190" fill="#eef7fb" font-size="25" font-weight="700">PHYSICAL PMSM</text><g transform="translate(135 230)" fill="none"><circle cx="160" cy="160" r="128" stroke="#b9cad5" stroke-width="28"/><circle cx="160" cy="160" r="58" stroke="#4ee0ed" stroke-width="20"/><path d="M160 35v250M35 160h250M71 71l178 178M249 71 71 249" stroke="#d79a69" stroke-width="10"/><circle cx="160" cy="160" r="12" fill="#eef7fb" stroke="none"/></g><text x="195" y="585" fill="#7d95a5" font-size="18">current · flux · vibration</text>
  <path d="M425 375h130" stroke="url(#blue)" stroke-width="7"/><path d="m530 360 25 15-25 15" fill="none" stroke="#a8f4f5" stroke-width="5"/>
  <rect x="580" y="185" width="340" height="385" rx="12" fill="#0d2034" stroke="#4ee0ed" stroke-width="2"/><text x="620" y="245" fill="#4ee0ed" font-size="20" letter-spacing="3">TWIN CORE</text><text x="620" y="300" fill="#eef7fb" font-size="32" font-weight="700">COUPLED MODEL</text><rect x="620" y="345" width="240" height="48" rx="5" fill="#091728" stroke="#4ee0ed" stroke-opacity=".45"/><text x="640" y="377" fill="#b9cad5" font-size="20">electromagnetic field</text><rect x="620" y="420" width="240" height="48" rx="5" fill="#091728" stroke="#4ee0ed" stroke-opacity=".45"/><text x="640" y="452" fill="#b9cad5" font-size="20">structural response</text><rect x="620" y="495" width="240" height="48" rx="5" fill="#091728" stroke="#4ee0ed" stroke-opacity=".45"/><text x="640" y="527" fill="#b9cad5" font-size="20">surrogate update</text>
  <path d="M925 375h105" stroke="url(#blue)" stroke-width="7"/><path d="m1005 360 25 15-25 15" fill="none" stroke="#a8f4f5" stroke-width="5"/><text x="1020" y="330" fill="#eef7fb" font-size="25" font-weight="700">VALIDATION</text><path d="M1020 410c30-55 45 80 80-50" fill="none" stroke="#4ee0ed" stroke-width="6"/><path d="M1020 460c30-45 45 65 80-42" fill="none" stroke="#d79a69" stroke-width="4"/><text x="1020" y="510" fill="#7d95a5" font-size="17">measured / predicted</text></g>
</svg>
