<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Full-field virtual sensing of a rotating shaft</title><desc id="desc">Sparse measurement sensors inform a model that reconstructs an inaccessible full response field across a rotating shaft.</desc>
  <defs><linearGradient id="heat" x1="0" x2="1"><stop stop-color="#4ee0ed"/><stop offset=".53" stop-color="#a8f4f5"/><stop offset="1" stop-color="#d79a69"/></linearGradient></defs><rect width="1200" height="750" fill="#050b14"/><g stroke="#4ee0ed" stroke-opacity=".13"><path d="M0 100H1200M0 650H1200M100 0V750M430 0V750M780 0V750M1100 0V750"/></g>
  <text x="70" y="90" fill="#7d95a5" font-family="Arial, sans-serif" font-size="22" letter-spacing="5">FULL-FIELD VIRTUAL SENSING</text><g font-family="Arial, sans-serif"><text x="90" y="210" fill="#eef7fb" font-size="25" font-weight="700">SPARSE MEASUREMENTS</text><path d="M110 385H400" stroke="#b9cad5" stroke-width="24" stroke-linecap="round"/><g fill="#d79a69" stroke="#eef7fb" stroke-width="4"><circle cx="155" cy="385" r="17"/><circle cx="280" cy="385" r="17"/><circle cx="375" cy="385" r="17"/></g><text x="130" y="455" fill="#7d95a5" font-size="18">3 measured sensor locations</text>
  <path d="M435 385h110" stroke="#4ee0ed" stroke-width="7"/><path d="m520 370 25 15-25 15" fill="none" stroke="#a8f4f5" stroke-width="5"/><rect x="570" y="230" width="250" height="310" rx="12" fill="#0d2034" stroke="#4ee0ed" stroke-width="2"/><text x="605" y="295" fill="#4ee0ed" font-size="20" letter-spacing="2">PADO-NET</text><text x="605" y="348" fill="#eef7fb" font-size="29" font-weight="700">DOMAIN</text><text x="605" y="385" fill="#eef7fb" font-size="29" font-weight="700">ADAPTATION</text><path d="M610 435h170M610 470h130" stroke="#b9cad5" stroke-opacity=".7" stroke-width="5"/><text x="605" y="505" fill="#7d95a5" font-size="16">physics + measurements</text>
  <path d="M835 385h105" stroke="#4ee0ed" stroke-width="7"/><path d="m915 370 25 15-25 15" fill="none" stroke="#a8f4f5" stroke-width="5"/><text x="950" y="210" fill="#eef7fb" font-size="25" font-weight="700">RECONSTRUCTED FIELD</text><path d="M965 385h165" stroke="url(#heat)" stroke-width="44" stroke-linecap="round"/><g fill="#eef7fb" opacity=".8"><circle cx="980" cy="385" r="5"/><circle cx="1010" cy="385" r="5"/><circle cx="1040" cy="385" r="5"/><circle cx="1070" cy="385" r="5"/><circle cx="1100" cy="385" r="5"/></g><text x="965" y="455" fill="#7d95a5" font-size="18">inaccessible locations become observable</text></g>
</svg>
